[package]
name = "pilotfish"
version = "0.2.0"
edition = "2024"
description = "A fleet of headless pi coding agents in your terminal, orchestrated by Claude Code."
repository = "https://github.com/SkymanOne/pilotfish"

[[bin]]
name = "pilotfish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.34"
keyring = "4.2.0"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["signal", "process"] }
nucleo-matcher = "0.3.1"
pulldown-cmark = "0.13.4"
rand = "0.10.2"
ratatui = "0.29.0"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.4.1", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textwrap = "0.16.2"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "fs", "sync", "time", "signal"] }
toml = "1.1.4"
toml_edit = "0.25.15"
tui-textarea = "0.7.0"
unicode-width = "0.2.0"
uuid = { version = "1.26.0", features = ["v4", "v5", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
tempfile = "3.27.0"
